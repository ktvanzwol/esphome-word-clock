name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/esphome/esphome:2026.10.2
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Test CI download configuration
        run: python -m unittest discover -s tests -p test_ci_validation.py
      - name: Run validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/validate.py
