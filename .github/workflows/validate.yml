name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/esphome/esphome:2026.10.2
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run validation
        run: python tests/validate.py --work /tmp/word-clock-validation --compile
